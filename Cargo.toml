[package]
name = "bjorst-resend"
version = "0.3.0"
edition = "2021"
authors = ["Bjorst Engineering <engineering@bjorst.com>"]
license = "MIT"
description = "Thin async Resend email client for Bjorst services"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Only with the `webhook` feature.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
# Svix webhook signature verification (`webhook::verify_webhook`) — how Resend
# signs its delivery webhooks.
webhook = ["dep:hmac", "dep:sha2", "dep:base64"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
